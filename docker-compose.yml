# MARINISE MVIS - FAZ 1 local/dev compose stack.
#
# NOTE (honesty, not an omission): this file has not been run through a live
# `docker compose up` in this session - the sandbox that built this project
# has no docker daemon available. What WAS verified end-to-end in-sandbox:
# the same Postgres+PostGIS schema/seed/API/frontend stack installed
# natively (see docs/PROGRESS.md). Please run `docker compose up --build`
# once and report back before relying on this for FAZ 1 sign-off.
version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: marinise
      POSTGRES_PASSWORD: marinise
      POSTGRES_DB: marinise
    volumes:
      - marinise_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marinise"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://marinise:marinise@db:5432/marinise
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m scripts.init_db &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  ais_worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://marinise:marinise@db:5432/marinise
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.services.ais_ingest"]

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  marinise_db_data:
